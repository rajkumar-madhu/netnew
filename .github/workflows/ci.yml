name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Backend unit and API tests
        run: npm test

      - name: Install Playwright with Chromium
        run: |
          npm install -g playwright@1
          npx -y playwright@1 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: End-to-end tests
        env:
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-artifacts
          if-no-files-found: ignore
